<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess 5C - Arena</title>
<style>
body {
background-color: #0d1117;
color: #c9d1d9;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
height: 100vh;
margin: 0;
overflow: hidden;
}
.arena-card {
background: linear-gradient(135deg, #161b22 0%, #0d1117 100%);
border: 2px solid #30363d;
border-radius: 16px;
padding: 30px;
text-align: center;
box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
width: 85%;
max-width: 400px;
}
h2 {
color: #58a6ff;
margin-bottom: 20px;
letter-spacing: 1px;
text-transform: uppercase;
}
button {
background: linear-gradient(135deg, #238636 0%, #2ea043 100%);
color: white;
border: none;
border-radius: 8px;
padding: 14px 24px;
font-size: 16px;
font-weight: bold;
cursor: pointer;
width: 100%;
margin-top: 15px;
box-shadow: 0 4px 12px rgba(35, 134, 54, 0.4);
transition: transform 0.1s ease, background 0.2s;
}
button:active {
transform: scale(0.97);
}
#status {
margin-top: 20px;
font-size: 14px;
color: #8b949e;
background: #21262d;
padding: 10px;
border-radius: 6px;
border: 1px solid #30363d;
}
</style>
</head>
<body>

<div class="arena-card">
<h2>Chess 5C Arena</h2>
<button id="connectBtn">Conectar Carteira</button>

<div id="gameControls" style="display:none;">
<button id="joinBtn">Entrar na Partida (0.05 USDC)</button>
</div>

<p id="status">Status: Aguardando conexão...</p>
</div>

<!-- Biblioteca Ethers.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>

<!-- Lógica do aplicativo integrada -->
<script>
const USDC_ADDRESS = "0x8335200cd6164806ce600d99f850e08436282913";
const USDC_ABI = [
  "function balanceOf(address account) view returns (uint256)",
  "function transfer(address recipient, uint256 amount) returns (bool)"
];

let provider;
let signer;
let userAddress;

document.getElementById('connectBtn').addEventListener('click', async () => {
  const statusEl = document.getElementById('status');

  if (typeof window.ethereum === 'undefined') {
    statusEl.innerText = "Status: Carteira Web3 não encontrada! Abra pelo navegador da carteira.";
    return;
  }

  try {
    statusEl.innerText = "Status: Conectando à carteira...";
    provider = new ethers.BrowserProvider(window.ethereum);
    await provider.send("eth_requestAccounts", []);
    signer = await provider.getSigner();
    userAddress = await signer.getAddress();

    statusEl.innerText = `Conectado: ${userAddress.substring(0, 6)}...${userAddress.substring(38)}`;
    document.getElementById('connectBtn').innerText = "Carteira Conectada";
    document.getElementById('connectBtn').style.background = "#21262d";
    document.getElementById('gameControls').style.display = "block";
  } catch (error) {
    console.error(error);
    statusEl.innerText = "Status: Erro ao conectar carteira.";
  }
});

document.getElementById('joinBtn')?.addEventListener('click', async () => {
  const statusEl = document.getElementById('status');
  if (!signer) return;

  try {
    statusEl.innerText = "Status: Preparando transação na Rede Base...";
    const usdcContract = new ethers.Contract(USDC_ADDRESS, USDC_ABI, signer);
    const valorAposta = ethers.parseUnits("0.05", 6);
    const destino = userAddress;

    statusEl.innerText = "Status: Confirme a transação na sua carteira...";
    const tx = await usdcContract.transfer(destino, valorAposta);

    statusEl.innerText = "Status: Processando na blockchain...";
    await tx.wait();

    statusEl.innerText = "Status: Sucesso! Você entrou na partida.";
  } catch (error) {
    console.error(error);
    statusEl.innerText = "Status: Transação cancelada ou falhou.";
  }
});
</script>
</body>
</html>
