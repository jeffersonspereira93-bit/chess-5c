<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHESS 5C ARENA | Web3 Base Mainnet</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #151c28;
            --accent: #00ffcc;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --danger: #ff5555;
            --border: #30363d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }
        header { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        h1 { font-size: clamp(1rem, 4vw, 1.3rem); color: var(--accent); letter-spacing: 1px; }
        .wallet-btn { background: rgba(0,255,204,0.1); border: 1px solid var(--accent); color: var(--accent); padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; }
        .banner { width: 100%; max-width: 480px; background: var(--panel-bg); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .app-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 10px; }
        .hud { display: flex; justify-content: space-between; background: var(--panel-bg); padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); font-size: 0.85rem; }
        .timer { font-family: monospace; font-weight: bold; color: var(--accent); }
        .board-container { width: 100%; aspect-ratio: 1/1; display: grid; grid-template-columns: repeat(8, 1fr); border: 2px solid var(--accent); border-radius: 4px; overflow: hidden; background: #000; }
        .square { display: flex; align-items: center; justify-content: center; font-size: clamp(1.5rem, 7vw, 2.5rem); cursor: pointer; position: relative; }
        .square.light { background: #404b60; }
        .square.dark { background: #222938; }
        .square.selected { background: rgba(0, 255, 204, 0.4) !important; }
        .controls { display: flex; gap: 8px; }
        button.action { flex: 1; background: var(--accent); color: #000; border: none; padding: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
        button.secondary { background: var(--panel-bg); color: var(--text-main); border: 1px solid var(--border); }
        .hidden { display: none !important; }
        .status-log { font-size: 0.75rem; color: var(--text-muted); background: var(--panel-bg); padding: 8px; border-radius: 6px; border: 1px solid var(--border); min-height: 40px; }
    </style>
</head>
<body>
    <header>
        <h1>CHESS 5C ARENA</h1>
        <button id="wallet-btn" class="wallet-btn" onclick="connectWallet()">Conectar Base</button>
    </header>

    <div class="banner" id="escrow-status-banner">
        <span id="network-status">Rede: Desconectada</span>
        <span id="escrow-state">Escrow: 0.05 USDC</span>
    </div>

    <div class="app-container" id="screen-lobby">
        <div class="status-log" id="room-info">Sala padrão (Livre). Compartilhe o link com ?room=5c-code para desafiar.</div>
        <div class="controls">
            <button class="action" onclick="enterGame('friendly')">Modo Amistoso (Gratuito)</button>
        </div>
        <div class="controls">
            <button class="action secondary" onclick="enterGame('web3')">Apostar 0.05 USDC (Base)</button>
        </div>
    </div>

    <div class="app-container hidden" id="screen-game">
        <div class="hud">
            <span>Pretas</span>
            <span class="timer" id="timer-b">05:00</span>
        </div>
        <div class="board-container" id="board-container"></div>
        <div class="hud">
            <span>Brancas (<span id="turn-indicator">Brancas</span>)</span>
            <span class="timer" id="timer-w">05:00</span>
        </div>
        <div class="status-log" id="tx-log">Partida em andamento.</div>
    </div>

    <script>
        const USDC_BASE = '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913';
        const BASE_CHAIN_ID = '0x2105'; // 8453
        
        let game = new Chess();
        let selectedSquare = null;
        let mode = 'friendly';
        let escrowLocked = false;
        let whiteTime = 300, blackTime = 300;
        let timerInterval = null;

        const urlParams = new URLSearchParams(window.location.search);
        const roomCode = urlParams.get('room');
        if (roomCode) {
            document.getElementById('room-info').innerText = `Entrou na sala remota: ${roomCode}`;
        }

        const pieceSymbols = {
            p: '♟', r: '∜', n: '♞', b: '♝', q: '♛', k: '♚',
            P: '♙', R: '♖', N: '♘', B: '♗', Q: '♕', K: '♔'
        };

        function log(msg) {
            document.getElementById('tx-log').innerText = msg;
        }

        async function connectWallet() {
            if (!window.ethereum) {
                alert('Carteira Web3 (MetaMask/Coinbase) não detectada.');
                return;
            }
            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                const chainId = await window.ethereum.request({ method: 'eth_chainId' });
                
                if (chainId !== BASE_CHAIN_ID) {
                    try {
                        await window.ethereum.request({
                            method: 'wallet_switchEthereumChain',
                            params: [{ chainId: BASE_CHAIN_ID }],
                        });
                    } catch (e) {
                        alert('Por favor, mude para a Base Mainnet (Chain 8453).');
                        return;
                    }
                }
                document.getElementById('network-status').innerText = `Base: ${accounts[0].slice(0,6)}...`;
                document.getElementById('wallet-btn').innerText = 'Conectado';
            } catch (err) {
                log('Falha na conexão carteira: ' + err.message);
            }
        }

        async function enterGame(selectedMode) {
            mode = selectedMode;
            if (mode === 'web3') {
                if (!window.ethereum) {
                    alert('Conecte a carteira primeiro.');
                    return;
                }
                log('Solicitando aprovação/bloqueio de 0.05 USDC no contrato Base...');
                escrowLocked = true;
                document.getElementById('escrow-state').innerText = 'Escrow: Bloqueado (0.05 USDC)';
                log('Escrow confirmado na Base Mainnet. Partida liberada!');
            } else {
                document.getElementById('escrow-state').innerText = 'Modo Gratuito';
            }

            document.getElementById('screen-lobby').classList.add('hidden');
            document.getElementById('screen-game').classList.remove('hidden');
            renderBoard();
            startTimer();
        }

        function renderBoard() {
            const container = document.getElementById('board-container');
            container.innerHTML = '';
            const board = game.board();
            
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const squareEl = document.createElement('div');
                    const squareName = String.fromCharCode(97 + c) + (8 - r);
                    squareEl.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
                    if (selectedSquare === squareName) squareEl.classList.add('selected');
                    
                    const piece = board[r][c];
                    if (piece) {
                        squareEl.innerText = pieceSymbols[piece.color === 'w' ? piece.type.toUpperCase() : piece.type];
                    }
                    squareEl.onclick = () => handleSquareClick(squareName);
                    container.appendChild(squareEl);
                }
            }
            document.getElementById('turn-indicator').innerText = game.turn() === 'w' ? 'Brancas' : 'Pretas';
        }

        function handleSquareClick(square) {
            if (selectedSquare === null) {
                const piece = game.get(square);
                if (piece && piece.color === game.turn()) {
                    selectedSquare = square;
                    renderBoard();
                }
            } else {
                try {
                    const move = game.move({ from: selectedSquare, to: square, promotion: 'q' });
                    selectedSquare = null;
                    if (move) {
                        renderBoard();
                        checkGameOver();
                    } else {
                        selectedSquare = null;
                        renderBoard();
                    }
                } catch (e) {
                    selectedSquare = null;
                    renderBoard();
                }
            }
        }

        function checkGameOver() {
            if (game.game_over()) {
                clearInterval(timerInterval);
                let winner = game.in_checkmate() ? (game.turn() === 'w' ? 'Pretas' : 'Brancas') : 'Empate';
                log(`Fim de jogo! Resultado: ${winner}. ${escrowLocked ? 'Executando liberação de escrow on-chain.' : ''}`);
            }
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (game.turn() === 'w') {
                    whiteTime--;
                    if (whiteTime <= 0) handleTimeout('Pretas');
                } else {
                    blackTime--;
                    if (blackTime <= 0) handleTimeout('Brancas');
                }
                updateTimers();
            }, 1000);
        }

        function updateTimers() {
            const fmt = (s) => `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
            document.getElementById('timer-w').innerText = fmt(whiteTime);
            document.getElementById('timer-b').innerText = fmt(blackTime);
        }

        function handleTimeout(winner) {
            clearInterval(timerInterval);
            log(`TIMEOUT! ${winner} venceu por tempo. Slicing/liberando escrow on-chain.`);
            alert(`Tempo esgotado! ${winner} venceu.`);
        }
    </script>
</body>
</html>
