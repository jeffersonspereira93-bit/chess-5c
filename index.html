<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess 5C - Arena Web3</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
body {
background-color: #0d1117;
color: #c9d1d9;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
display: flex;
flex-direction: column;
align-items: center;
justify-content: flex-start;
min-height: 100vh;
margin: 0;
padding: 15px;
box-sizing: border-box;
}
.arena-container {
background: linear-gradient(135deg, #161b22 0%, #0d1117 100%);
border: 2px solid #30363d;
border-radius: 16px;
padding: 20px;
text-align: center;
box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
width: 100%;
max-width: 420px;
}
h2 {
color: #58a6ff;
margin-bottom: 15px;
letter-spacing: 1px;
text-transform: uppercase;
font-size: 20px;
}
button {
background: linear-gradient(135deg, #238636 0%, #2ea043 100%);
color: white;
border: none;
border-radius: 8px;
padding: 12px 20px;
font-size: 15px;
font-weight: bold;
cursor: pointer;
width: 100%;
margin-top: 10px;
box-shadow: 0 4px 12px rgba(35, 134, 54, 0.4);
transition: transform 0.1s ease;
}
.btn-secondary {
background: linear-gradient(135deg, #1f6feb 0%, #388bfd 100%);
box-shadow: 0 4px 12px rgba(31, 111, 235, 0.4);
}
button:active {
transform: scale(0.97);
}
#status {
margin: 15px 0;
font-size: 13px;
color: #8b949e;
background: #21262d;
padding: 10px;
border-radius: 6px;
border: 1px solid #30363d;
word-break: break-all;
}
#board {
display: grid;
grid-template-columns: repeat(8, 1fr);
width: 100%;
max-width: 380px;
aspect-ratio: 1;
margin: 20px auto;
border: 4px solid #30363d;
border-radius: 8px;
overflow: hidden;
box-shadow: 0 6px 16px rgba(0,0,0,0.6);
background-color: #30363d;
gap: 1px;
}
.square {
display: flex;
align-items: center;
justify-content: center;
font-size: 32px;
cursor: pointer;
user-select: none;
transition: background-color 0.1s;
}
.square.light {
background-color: #f0d9b5;
}
.square.dark {
background-color: #b58863;
}
.square.selected {
background-color: #7b61ff !important;
}
</style>
</head>
<body>

<div class="arena-container">
<h2>Chess 5C Arena</h2>
<button id="connectBtn">Conectar Carteira</button>

<div id="gameModes" style="display:none;">
<button id="friendlyBtn" class="btn-secondary">Modo Amistoso (Gratuito Online)</button>
<button id="joinBtn">Arena Competitiva (0.05 USDC)</button>
</div>

<p id="status">Status: Aguardando conexão...</p>

<div id="boardContainer" style="display:none;">
<div id="board"></div>
<p id="turnInfo" style="font-size: 15px; color: #58a6ff; margin-top: 10px; font-weight: bold;">Vez das Brancas</p>
<button id="exitBtn" class="btn-secondary" style="margin-top: 15px; padding: 8px; font-size: 13px;">Sair / Voltar ao Menu</button>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>

<script>
const CONTRACT_ADDRESS = "SEU_CONTRATO_INTELIGENTE_AQUI"; 
const USDC_ADDRESS = "0x8335200cd6164806ce600d99f850e08436282913";
const USDC_ABI = [
  "function transfer(address recipient, uint256 amount) returns (bool)"
];

let provider;
let signer;
let userAddress;
let game = new Chess();
let selectedSquare = null;

const pieceSymbols = {
  p: '♟', r: '♜', n: '♞', b: '♝', q: '♛', k: '♚',
  P: '♙', R: '♖', N: '♘', B: '♗', Q: '♕', K: '♔'
};

document.getElementById('connectBtn').addEventListener('click', async () => {
  const statusEl = document.getElementById('status');
  if (typeof window.ethereum === 'undefined') {
    statusEl.innerText = "Status: Carteira Web3 não encontrada!";
    return;
  }
  try {
    statusEl.innerText = "Status: Conectando à carteira...";
    provider = new ethers.BrowserProvider(window.ethereum);
    await provider.send("eth_requestAccounts", []);
    signer = await provider.getSigner();
    userAddress = await signer.getAddress();

    statusEl.innerText = `Conectado: ${userAddress.substring(0, 6)}...${userAddress.substring(38)}`;
    document.getElementById('connectBtn').innerText = "Carteira Conectada";
    document.getElementById('connectBtn'].style.background = "#21262d";
    document.getElementById('gameModes').style.display = "block";
  } catch (error) {
    console.error(error);
    statusEl.innerText = "Status: Erro ao conectar carteira.";
  }
});

// Modo Amistoso Gratuito Online (Sem custo, abre direto para jogar)
document.getElementById('friendlyBtn').addEventListener('click', () => {
  startMatch("Modo Amistoso (Gratuito)");
});

// Arena Competitiva (Valendo 0.05 USDC via contrato inteligente)
document.getElementById('joinBtn').addEventListener('click', async () => {
  const statusEl = document.getElementById('status');
  if (!signer) return;

  try {
    statusEl.innerText = "Status: Preparando aposta na Rede Base...";
    const usdcContract = new ethers.Contract(USDC_ADDRESS, USDC_ABI, signer);
    const valorAposta = ethers.parseUnits("0.05", 6);
    
    statusEl.innerText = "Status: Confirme a aposta de 0.05 USDC...";
    const tx = await usdcContract.transfer(userAddress, valorAposta); // Substituir pelo contrato de tesouraria em produção

    statusEl.innerText = "Status: Processando na blockchain Base...";
    await tx.wait();

    startMatch("Arena Competitiva Iniciada (Valendo Pote)");
  } catch (error) {
    console.error(error);
    statusEl.innerText = "Status: Transação cancelada ou falhou.";
  }
});

document.getElementById('exitBtn').addEventListener('click', () => {
  document.getElementById('boardContainer').style.display = "none";
  document.getElementById('gameModes').style.display = "block";
  document.getElementById('status').innerText = "Status: Conectado. Escolha o modo de jogo.";
});

function startMatch(statusMsg) {
  document.getElementById('status').innerText = `Status: ${statusMsg}`;
  document.getElementById('gameModes').style.display = "none";
  document.getElementById('boardContainer').style.display = "block";
  game.reset();
  selectedSquare = null;
  renderBoard();
}

function renderBoard() {
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  const boardData = game.board();

  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const squareEl = document.createElement('div');
      const isDark = (r + c) % 2 === 1;
      squareEl.className = `square ${isDark ? 'dark' : 'light'}`;
      
      const file = 'abcdefgh'[c];
      const rank = '87654321'[r];
      const squareCoord = file + rank;

      if (selectedSquare === squareCoord) {
        squareEl.classList.add('selected');
      }

      const piece = boardData[r][c];
      if (piece) {
        squareEl.innerText = pieceSymbols[piece.color === 'w' ? piece.type.toUpperCase() : piece.type.toLowerCase()];
        squareEl.style.color = piece.color === 'w' ? '#ffffff' : '#111111';
        squareEl.style.textShadow = piece.color === 'w' ? '0 1px 2px rgba(0,0,0,0.8)' : '0 1px 2px rgba(255,255,255,0.3)';
      }

      squareEl.addEventListener('click', () => handleSquareClick(squareCoord));
      boardEl.appendChild(squareEl);
    }
  }

  const turnText = game.turn() === 'w' ? "Vez das Brancas" : "Vez das Pretas";
  if (game.in_checkmate()) {
    document.getElementById('turnInfo').innerText = "Fim de Jogo: Xeque-Mate!";
  } else if (game.in_draw()) {
    document.getElementById('turnInfo').innerText = "Fim de Jogo: Empate!";
  } else {
    document.getElementById('turnInfo').innerText = turnText;
  }
}

function handleSquareClick(square) {
  if (!selectedSquare) {
    const piece = game.get(square);
    if (piece && piece.color === game.turn()) {
      selectedSquare = square;
      renderBoard();
    }
  } else {
    const move = game.move({
      from: selectedSquare,
      to: square,
      promotion: 'q'
    });

    selectedSquare = null;
    if (move) {
      renderBoard();
    } else {
      const piece = game.get(square);
      if (piece && piece.color === game.turn()) {
        selectedSquare = square;
      }
      renderBoard();
    }
  }
}
</script>
</body>
</html>
