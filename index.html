<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chess 5C Arena | Cyberpunk Edition</title>
    <!-- Motor FIDE Open Source (chess.js) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #131b2e;
            --neon-cyan: #00f3ff;
            --neon-purple: #b000ff;
            --neon-green: #00ff66;
            --neon-red: #ff0055;
            --text-color: #e0e6ed;
            --border-glow: 0 0 10px rgba(0, 243, 255, 0.35);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; padding: 6px; overflow-x: hidden; }
        
        header { width: 100%; max-width: 340px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; padding: 0 2px; }
        h1 { font-size: 0.95rem; color: var(--neon-cyan); text-shadow: 0 0 8px rgba(0, 243, 255, 0.5); letter-spacing: 1px; }
        .wallet-badge { font-size: 0.65rem; color: var(--neon-cyan); background: rgba(0,243,255,0.1); border: 1px solid var(--neon-cyan); padding: 3px 6px; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
        .wallet-badge:hover { background: rgba(0,243,255,0.25); }

        .screen { width: 100%; max-width: 340px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .hidden { display: none !important; }

        .menu-panel { background-color: var(--panel-bg); border: 1px solid var(--neon-cyan); box-shadow: var(--border-glow); border-radius: 12px; padding: 16px; width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .escrow-info { font-size: 0.72rem; color: #8a99ad; text-align: center; background: rgba(176,0,255,0.1); border: 1px solid rgba(176,0,255,0.3); padding: 5px; border-radius: 6px; }
        .btn-cyber { background: linear-gradient(135deg, #1f293d 0%, #111827 100%); border: 1px solid var(--neon-cyan); color: var(--neon-cyan); padding: 12px; border-radius: 8px; font-size: 0.85rem; font-weight: bold; cursor: pointer; transition: all 0.2s ease; text-align: center; text-transform: uppercase; }
        .btn-cyber:active { transform: scale(0.98); }
        .btn-secondary { border-color: var(--neon-purple); color: var(--neon-purple); }

        .game-hud { width: 100%; max-width: 336px; display: flex; justify-content: space-between; align-items: center; background: var(--panel-bg); border: 1px solid var(--neon-cyan); padding: 6px 10px; border-radius: 6px; font-size: 0.75rem; flex-shrink: 0; }
        
        .board-wrapper { 
            width: 100%; 
            max-width: 336px; 
            aspect-ratio: 1 / 1; 
            border: 2px solid var(--neon-purple); 
            box-shadow: 0 0 15px rgba(176, 0, 255, 0.4); 
            border-radius: 6px; 
            overflow: hidden; 
            background: var(--panel-bg); 
            margin: 2px auto; 
            flex-shrink: 0;
            display: block;
        }
        #board-container { 
            width: 100%; 
            height: 100%; 
            display: grid; 
            grid-template-columns: repeat(8, 1fr); 
            grid-template-rows: repeat(8, 1fr); 
        }
        
        .square { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: clamp(1.1rem, 7.5vw, 1.85rem); 
            line-height: 1; 
            cursor: pointer; 
            user-select: none; 
            width: 100%; 
            height: 100%; 
            position: relative; 
            box-sizing: border-box;
            flex-shrink: 0;
            flex-grow: 0;
        }
        .square.light { background-color: #24344d; }
        .square.dark { background-color: #111827; }
        .square.selected { background-color: rgba(0, 243, 255, 0.45) !important; box-shadow: inset 0 0 8px var(--neon-cyan); }
        .square.valid-move::after { content: ''; width: 28%; height: 28%; background-color: var(--neon-green); border-radius: 50%; box-shadow: 0 0 6px var(--neon-green); opacity: 0.9; }
        .square.check-alert { background-color: rgba(255, 0, 85, 0.5) !important; box-shadow: inset 0 0 10px var(--neon-red); }

        .hud-bottom { width: 100%; max-width: 336px; display: flex; flex-direction: column; gap: 4px; font-size: 0.72rem; color: #8a99ad; flex-shrink: 0; }
        .captures-row { display: flex; justify-content: space-between; background: var(--panel-bg); border: 1px solid rgba(0, 243, 255, 0.2); padding: 5px 8px; border-radius: 6px; min-height: 26px; align-items: center; }
        #match-status { font-size: 0.75rem; color: var(--neon-cyan); text-align: center; }
        footer { margin-top: 4px; font-size: 0.65rem; color: #64748b; text-align: center; }
    </style>
</head>
<body>

    <header>
        <h1>CHESS 5C ARENA</h1>
        <span id="wallet-btn" class="wallet-badge" onclick="connectWallet()">Conectar Carteira</span>
    </header>

    <div id="screen-lobby" class="screen">
        <div class="menu-panel">
            <div id="escrow-status-banner" class="escrow-info">⚡ Protocolo Web3 Base/USDC Disconectado</div>
            <button class="btn-cyber" onclick="enterGame('friendly')">Modo Amistoso (Gratuito)</button>
            <button class="btn-cyber" onclick="enterGame('competitive')">Arena Competitiva (0.05 USDC)</button>
            <button class="btn-cyber btn-secondary" onclick="openSkinShop()">Loja de Skins NFT (Em Breve)</button>
        </div>
    </div>

    <div id="screen-game" class="screen hidden">
        <div class="game-hud">
            <span id="turn-indicator">Turno: Brancas</span>
            <button class="btn-cyber" style="padding: 2px 8px; font-size: 0.65rem;" onclick="returnToLobby()">Lobby</button>
        </div>
        <div class="board-wrapper">
            <div id="board-container"></div>
        </div>
        <div class="hud-bottom">
            <div id="match-status">Selecione uma peça válida</div>
            <div class="captures-row">
                <span>Derrubadas (Brancas): <strong id="caps-white" style="color:var(--neon-cyan)">-</strong></span>
                <span>Derrubadas (Pretas): <strong id="caps-black" style="color:#fff">-</strong></span>
            </div>
        </div>
    </div>

    <footer>Chess 5C Arena &bull; Web3 Protocol &bull; Cyberpunk Edition</footer>

    <script>
        let game = new Chess();
        let selectedSquare = null;
        let capturedWhite = [];
        let capturedBlack = [];
        let userAddress = null;
        let activeMode = 'friendly';
        let escrowLocked = false;

        const BASE_CHAIN_ID = '0x2105'; // Base Mainnet (8453) ou use teste se preferir
        const ESCROW_CONTRACT_MOCK = '0x71C...Chess5CBaseEscrow';
        const USDC_BASE_ADDRESS = '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913';

        const pieceGlyphs = {
            p: '♟', r: '♜', n: '♞', b: '♝', q: '♛', k: '♚',
            P: '♙', R: '♖', N: '♘', B: '♗', Q: '♕', K: '♔'
        };

        async function connectWallet() {
            if (window.ethereum) {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    if (accounts.length > 0) {
                        userAddress = accounts[0];
                        const shortAddr = userAddress.substring(0, 6) + '...' + userAddress.substring(userAddress.length - 4);
                        document.getElementById('wallet-btn').textContent = shortAddr;
                        document.getElementById('wallet-btn').style.borderColor = 'var(--neon-green)';
                        document.getElementById('wallet-btn').style.color = 'var(--neon-green)';
                        document.getElementById('escrow-status-banner').textContent = `⚡ Base Network Conectada (${shortAddr})`;
                        
                        // Opcional: checar switch chain base
                        try {
                            await window.ethereum.request({
                                method: 'wallet_switchEthereumChain',
                                params: [{ chainId: BASE_CHAIN_ID }]
                            });
                        } catch (e) {
                            console.log('Chain switch opcional ignorada ou não suportada');
                        }
                    }
                } catch (err) {
                    alert('Conexão recusada pela carteira.');
                }
            } else {
                userAddress = '0x5C...9A41';
                document.getElementById('wallet-btn').textContent = userAddress;
                document.getElementById('wallet-btn').style.borderColor = 'var(--neon-green)';
                document.getElementById('wallet-btn').style.color = 'var(--neon-green)';
                document.getElementById('escrow-status-banner').textContent = `⚡ Web3 Simulado (Modo Fallback)`;
            }
        }

        async function triggerOnChainEscrowLock() {
            if (window.ethereum && userAddress && userAddress.startsWith('0x') && userAddress.length > 10) {
                // Exemplo estrutural de requisição de assinatura/transação de aprovação/transferência USDC
                // Aqui simulamos o fluxo Web3 seguro de smart contract escrow lock
                const confirmed = confirm(`[BASE NETWORK ESCROW]\nContrato: ${ESCROW_CONTRACT_MOCK}\nToken: USDC (0.05)\nCarteira: ${userAddress}\nConfirmar assinatura de travamento de fundos?`);
                if (!confirmed) return false;
                escrowLocked = true;
                return true;
            } else {
                const confirmed = confirm("Confirmar Escrow Simulado de 0.05 USDC no Smart Contract da Arena Competitiva (Base Network)?");
                if (!confirmed) return false;
                escrowLocked = true;
                return true;
            }
        }

        async function enterGame(mode) {
            activeMode = mode;
            if (mode === 'competitive') {
                const locked = await triggerOnChainEscrowLock();
                if (!locked) return;
            } else {
                escrowLocked = false;
            }
            document.getElementById('screen-lobby').classList.add('hidden');
            document.getElementById('screen-game').classList.remove('hidden');
            game.reset();
            capturedWhite = [];
            capturedBlack = [];
            updateCapturesUI();
            renderBoard();
        }

        function returnToLobby() {
            if (activeMode === 'competitive' && escrowLocked && !game.in_checkmate()) {
                const leave = confirm("Aviso: Sair da partida competitiva com escrow ativo pode penalizar reputação on-chain. Deseja sair?");
                if (!leave) return;
            }
            document.getElementById('screen-game').classList.add('hidden');
            document.getElementById('screen-lobby').classList.remove('hidden');
        }

        function algebraicToIndex(sq) {
            const file = sq.charCodeAt(0) - 'a'.charCodeAt(0);
            const rank = 8 - parseInt(sq[1], 10);
            return { r: rank, c: file };
        }

        function indexToAlgebraic(r, c) {
            const file = String.fromCharCode('a'.charCodeAt(0) + c);
            const rank = 8 - r;
            return file + rank;
        }

        function getValidMovesForUI(r, c) {
            const sqAlg = indexToAlgebraic(r, c);
            const moves = game.moves({ square: sqAlg, verbose: true });
            return moves.map(m => algebraicToIndex(m.to));
        }

        function renderBoard() {
            const boardEl = document.getElementById('board-container');
            boardEl.innerHTML = '';
            const boardData = game.board();
            const legalMovesUI = selectedSquare ? getValidMovesForUI(selectedSquare.r, selectedSquare.c) : [];

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const sq = document.createElement('div');
                    const isLight = (r + c) % 2 === 0;
                    sq.className = `square ${isLight ? 'light' : 'dark'}`;
                    
                    const cell = boardData[r][c];
                    if (cell) {
                        const glyph = pieceGlyphs[cell.color === 'w' ? cell.type.toUpperCase() : cell.type];
                        sq.textContent = glyph;
                        const isW = cell.color === 'w';
                        sq.style.color = isW ? '#e0e6ed' : '#00f3ff';
                        sq.style.textShadow = isW ? '0 0 3px rgba(224,230,237,0.6)' : '0 0 5px rgba(0,243,255,0.85)';
                        
                        if (cell.type === 'k' && game.in_check() && cell.color === game.turn()) {
                            sq.classList.add('check-alert');
                        }
                    }

                    if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) {
                        sq.classList.add('selected');
                    }
                    if (legalMovesUI.some(m => m.r === r && m.c === c)) {
                        sq.classList.add('valid-move');
                    }

                    sq.onclick = () => handleSquareClick(r, c);
                    boardEl.appendChild(sq);
                }
            }

            const turnText = game.turn() === 'w' ? 'Brancas' : 'Pretas';
            let statusText = `Turno: ${turnText}`;
            if (game.in_checkmate()) {
                statusText = `Xeque-mate! ${turnText === 'w' ? 'Pretas' : 'Brancas'} venceram!`;
                if (escrowLocked) statusText += ' 💰 (Escrow liberado on-chain)';
            }
            else if (game.in_draw()) statusText = 'Empate (Afogamento/Repetição)!';
            else if (game.in_check()) statusText += ' ⚠️ XEQUE!';

            document.getElementById('turn-indicator').textContent = statusText;
            document.getElementById('match-status').textContent = game.in_checkmate() ? 'Fim de jogo - Settlement concluído' : 'Selecione uma peça válida';
        }

        function updateCapturesUI() {
            document.getElementById('caps-white').textContent = capturedWhite.join(' ') || '-';
            document.getElementById('caps-black').textContent = capturedBlack.join(' ') || '-';
        }

        function handleSquareClick(r, c) {
            const sqAlg = indexToAlgebraic(r, c);

            if (selectedSquare) {
                const legalMoves = game.moves({ square: indexToAlgebraic(selectedSquare.r, selectedSquare.c), verbose: true });
                const targetMove = legalMoves.find(m => m.to === sqAlg);

                if (targetMove) {
                    const moveResult = game.move({
                        from: targetMove.from,
                        to: targetMove.to,
                        promotion: targetMove.promotion ? 'q' : undefined
                    });

                    if (moveResult) {
                        if (moveResult.captured) {
                            const capGlyph = pieceGlyphs[moveResult.captured];
                            if (moveResult.color === 'w') capturedBlack.push(capGlyph);
                            else capturedWhite.push(capGlyph);
                            updateCapturesUI();
                        }
                        selectedSquare = null;
                        renderBoard();
                        return;
                    }
                }
            }

            const boardData = game.board();
            const cell = boardData[r][c];
            if (cell && cell.color === game.turn()) {
                selectedSquare = { r, c };
                renderBoard();
            } else {
                selectedSquare = null;
                renderBoard();
            }
        }

        function openSkinShop() { alert('Loja de Skins NFT em breve!'); }
    </script>
</body>
</html>
