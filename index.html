<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chess 5C Arena | Cyberpunk Edition</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #131b2e;
            --neon-cyan: #00f3ff;
            --neon-purple: #b000ff;
            --neon-green: #00ff66;
            --text-color: #e0e6ed;
            --border-glow: 0 0 10px rgba(0, 243, 255, 0.35);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; padding: 8px; overflow-x: hidden; }
        
        header { width: 100%; max-width: 420px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding: 0 4px; }
        h1 { font-size: 1.15rem; color: var(--neon-cyan); text-shadow: 0 0 8px rgba(0, 243, 255, 0.5); letter-spacing: 1.2px; }
        .wallet-badge { font-size: 0.72rem; color: var(--neon-cyan); background: rgba(0,243,255,0.1); border: 1px solid var(--neon-cyan); padding: 3px 8px; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
        .wallet-badge:hover { background: rgba(0,243,255,0.25); }

        .screen { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .hidden { display: none !important; }

        .menu-panel { background-color: var(--panel-bg); border: 1px solid var(--neon-cyan); box-shadow: var(--border-glow); border-radius: 12px; padding: 18px; width: 100%; display: flex; flex-direction: column; gap: 12px; margin-top: 25px; }
        .escrow-info { font-size: 0.75rem; color: #8a99ad; text-align: center; background: rgba(176,0,255,0.1); border: 1px solid rgba(176,0,255,0.3); padding: 6px; border-radius: 6px; }
        .btn-cyber { background: linear-gradient(135deg, #1f293d 0%, #111827 100%); border: 1px solid var(--neon-cyan); color: var(--neon-cyan); padding: 14px; border-radius: 8px; font-size: 0.90rem; font-weight: bold; cursor: pointer; transition: all 0.2s ease; text-align: center; text-transform: uppercase; }
        .btn-cyber:active { transform: scale(0.98); }
        .btn-secondary { border-color: var(--neon-purple); color: var(--neon-purple); }

        .game-hud { width: 100%; display: flex; justify-content: space-between; align-items: center; background: var(--panel-bg); border: 1px solid var(--neon-cyan); padding: 6px 10px; border-radius: 8px; font-size: 0.8rem; }
        
        .board-wrapper { width: min(94vw, 392px); aspect-ratio: 1 / 1; border: 2px solid var(--neon-purple); box-shadow: 0 0 15px rgba(176, 0, 255, 0.4); border-radius: 8px; overflow: hidden; background: var(--panel-bg); margin: 4px auto; }
        #board-container { width: 100%; height: 100%; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); }
        
        .square { display: flex; align-items: center; justify-content: center; font-size: clamp(1.4rem, 5.5vw, 2.1rem); cursor: pointer; user-select: none; width: 100%; height: 100%; position: relative; }
        .square.light { background-color: #24344d; }
        .square.dark { background-color: #111827; }
        .square.selected { background-color: rgba(0, 243, 255, 0.45) !important; box-shadow: inset 0 0 12px var(--neon-cyan); }
        .square.valid-move::after { content: ''; width: 10px; height: 10px; background-color: var(--neon-green); border-radius: 50%; box-shadow: 0 0 8px var(--neon-green); opacity: 0.9; }

        .hud-bottom { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 4px; font-size: 0.75rem; color: #8a99ad; }
        .captures-row { display: flex; justify-content: space-between; background: var(--panel-bg); border: 1px solid rgba(0, 243, 255, 0.2); padding: 4px 8px; border-radius: 6px; min-height: 28px; align-items: center; }
        #match-status { font-size: 0.8rem; color: var(--neon-cyan); text-align: center; }
        footer { margin-top: 6px; font-size: 0.7rem; color: #64748b; text-align: center; }
    </style>
</head>
<body>

    <header>
        <h1>CHESS 5C ARENA</h1>
        <span id="wallet-btn" class="wallet-badge" onclick="connectWallet()">Conectar Carteira</span>
    </header>

    <div id="screen-lobby" class="screen">
        <div class="menu-panel">
            <div class="escrow-info">⚡ Protocolo Web3 Base/USDC Ativo</div>
            <button class="btn-cyber" onclick="enterGame('friendly')">Modo Amistoso (Gratuito)</button>
            <button class="btn-cyber" onclick="enterGame('competitive')">Arena Competitiva (0.05 USDC)</button>
            <button class="btn-cyber btn-secondary" onclick="openSkinShop()">Loja de Skins NFT (Em Breve)</button>
        </div>
    </div>

    <div id="screen-game" class="screen hidden">
        <div class="game-hud">
            <span id="turn-indicator">Turno: Brancas</span>
            <button class="btn-cyber" style="padding: 4px 10px; font-size: 0.7rem;" onclick="returnToLobby()">Lobby</button>
        </div>
        <div class="board-wrapper">
            <div id="board-container"></div>
        </div>
        <div class="hud-bottom">
            <div id="match-status">Selecione uma peça válida</div>
            <div class="captures-row">
                <span>Derrubadas (Brancas): <strong id="caps-white" style="color:var(--neon-cyan)">-</strong></span>
                <span>Derrubadas (Pretas): <strong id="caps-black" style="color:#fff">-</strong></span>
            </div>
        </div>
    </div>

    <footer>Chess 5C Arena &bull; Web3 Protocol &bull; Cyberpunk Edition</footer>

    <script>
        let boardState = [];
        let selectedSquare = null;
        let currentTurn = 'white';
        let validMoves = [];
        let capturedWhite = [];
        let capturedBlack = [];
        let userAddress = null;
        let activeMode = 'friendly';

        async function connectWallet() {
            if (window.ethereum) {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    if (accounts.length > 0) {
                        userAddress = accounts[0];
                        const shortAddr = userAddress.substring(0, 6) + '...' + userAddress.substring(userAddress.length - 4);
                        document.getElementById('wallet-btn').textContent = shortAddr;
                        document.getElementById('wallet-btn').style.borderColor = 'var(--neon-green)';
                        document.getElementById('wallet-btn').style.color = 'var(--neon-green)';
                    }
                } catch (err) {
                    alert('Conexão recusada pela carteira.');
                }
            } else {
                // Simulação mobile injetada se Web3 provider nativo ausente
                userAddress = '0x5C...9A41';
                document.getElementById('wallet-btn').textContent = userAddress;
                document.getElementById('wallet-btn').style.borderColor = 'var(--neon-green)';
                document.getElementById('wallet-btn').style.color = 'var(--neon-green)';
            }
        }

        async function initBoardData() {
            boardState = [
                ["♜","♞","♝","♛","♚","♝","♞","♜"],
                ["♟","♟","♟","♟","♟","♟","♟","♟"],
                ["","","","","","","",""],
                ["","","","","","","",""],
                ["","","","","","","",""],
                ["","","","","","","",""],
                ["♙","♙","♙","♙","♙","♙","♙","♙"],
                ["♖","♘","♗","♕","♔","♗","♘","♖"]
            ];
            capturedWhite = [];
            capturedBlack = [];
            updateCapturesUI();
        }

        async function enterGame(mode) {
            activeMode = mode;
            if (mode === 'competitive') {
                const confirmed = confirm("Confirma Escrow de 0.05 USDC no Smart Contract da Arena Competitiva (Base Network)?");
                if (!confirmed) return;
                alert(userAddress ? `Escrow 0.05 USDC travado na contract address vinculada a ${userAddress}` : 'Simulando Smart Contract Escrow Lock: 0.05 USDC garantidos!');
            }
            document.getElementById('screen-lobby').classList.add('hidden');
            document.getElementById('screen-game').classList.remove('hidden');
            await initBoardData();
            renderBoard();
        }

        function returnToLobby() {
            document.getElementById('screen-game').classList.add('hidden');
            document.getElementById('screen-lobby').classList.remove('hidden');
        }

        function isWhitePiece(p) { return "♙♖♘♗♕♔".includes(p); }
        function isBlackPiece(p) { return "♟♜♞♝♛♚".includes(p); }

        function getValidMoves(r, c) {
            const piece = boardState[r][c];
            if (!piece) return [];
            const isWhite = isWhitePiece(piece);
            const moves = [];
            const dir = isWhite ? -1 : 1;

            if (piece === '♙' || piece === '♟') {
                const r1 = r + dir;
                if (r1 >= 0 && r1 < 8 && boardState[r1][c] === "") {
                    moves.push({r: r1, c: c});
                    const startRow = isWhite ? 6 : 1;
                    const r2 = r + 2 * dir;
                    if (r === startRow && boardState[r2][c] === "") moves.push({r: r2, c: c});
                }
                [c - 1, c + 1].forEach(targetC => {
                    const r1 = r + dir;
                    if (r1 >= 0 && r1 < 8 && targetC >= 0 && targetC < 8) {
                        const target = boardState[r1][targetC];
                        if (target && isWhitePiece(target) !== isWhite) moves.push({r: r1, c: targetC});
                    }
                });
            } else if (piece === '♘' || piece === '♞') {
                const knightSteps = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
                knightSteps.forEach(([dr, dc]) => {
                    const nr = r + dr, nc = c + dc;
                    if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
                        const target = boardState[nr][nc];
                        if (!target || isWhitePiece(target) !== isWhite) moves.push({r: nr, c: nc});
                    }
                });
            } else if (piece === '♔' || piece === '♚') {
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        if (dr === 0 && dc === 0) continue;
                        const nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
                            const target = boardState[nr][nc];
                            if (!target || isWhitePiece(target) !== isWhite) moves.push({r: nr, c: nc});
                        }
                    }
                }
            } else {
                const dirs = [];
                if ("♖♜♕♛".includes(piece)) dirs.push([-1,0],[1,0],[0,-1],[0,1]);
                if ("♗♝♕♛".includes(piece)) dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);
                dirs.forEach(([dr, dc]) => {
                    let nr = r + dr, nc = c + dc;
                    while (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
                        const target = boardState[nr][nc];
                        if (!target) {
                            moves.push({r: nr, c: nc});
                        } else {
                            if (isWhitePiece(target) !== isWhite) moves.push({r: nr, c: nc});
                            break;
                        }
                        nr += dr; nc += dc;
                    }
                });
            }
            return moves;
        }

        function renderBoard() {
            const boardEl = document.getElementById('board-container');
            boardEl.innerHTML = '';
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const sq = document.createElement('div');
                    const isLight = (r + c) % 2 === 0;
                    sq.className = `square ${isLight ? 'light' : 'dark'}`;
                    const piece = boardState[r][c];
                    if (piece) {
                        sq.textContent = piece;
                        const isW = isWhitePiece(piece);
                        sq.style.color = isW ? '#e0e6ed' : '#00f3ff';
                        sq.style.textShadow = isW ? '0 0 5px rgba(224,230,237,0.6)' : '0 0 9px rgba(0,243,255,0.85)';
                    }
                    if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) sq.classList.add('selected');
                    if (validMoves.some(m => m.r === r && m.c === c)) sq.classList.add('valid-move');
                    sq.onclick = () => handleSquareClick(r, c);
                    boardEl.appendChild(sq);
                }
            }
            document.getElementById('turn-indicator').textContent = 'Turno: ' + (currentTurn === 'white' ? 'Brancas' : 'Pretas');
        }

        function updateCapturesUI() {
            document.getElementById('caps-white').textContent = capturedWhite.join(' ') || '-';
            document.getElementById('caps-black').textContent = capturedBlack.join(' ') || '-';
        }

        function handleSquareClick(r, c) {
            const p = boardState[r][c];
            const myTurnIsWhite = currentTurn === 'white';

            if (selectedSquare && validMoves.some(m => m.r === r && m.c === c)) {
                const targetPiece = boardState[r][c];
                const movingPiece = boardState[selectedSquare.r][selectedSquare.c];

                if (targetPiece) {
                    if (isWhitePiece(targetPiece)) capturedWhite.push(targetPiece);
                    else capturedBlack.push(targetPiece);
                    updateCapturesUI();
                    document.getElementById('match-status').textContent = `⚡ Derrubou ${targetPiece}!`;
                } else {
                    document.getElementById('match-status').textContent = `Movimento tático executado`;
                }

                boardState[r][c] = movingPiece;
                boardState[selectedSquare.r][selectedSquare.c] = "";
                selectedSquare = null;
                validMoves = [];
                currentTurn = currentTurn === 'white' ? 'black' : 'white';
                renderBoard();
                return;
            }

            if (p && ((isWhitePiece(p) && myTurnIsWhite) || (isBlackPiece(p) && !myTurnIsWhite))) {
                selectedSquare = {r, c};
                validMoves = getValidMoves(r, c);
                document.getElementById('match-status').textContent = `Unidade selecionada [${r+1},${c+1}] (${validMoves.length} alvos)`;
                renderBoard();
                return;
            }

            selectedSquare = null;
            validMoves = [];
            renderBoard();
        }

        function openSkinShop() { alert('Loja de Skins NFT em breve!'); }
    </script>
</body>
</html>
