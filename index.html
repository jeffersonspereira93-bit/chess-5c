<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chess 5C Arena | Cyberpunk Edition</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #131b2e;
            --neon-cyan: #00f3ff;
            --neon-purple: #b000ff;
            --text-color: #e0e6ed;
            --border-glow: 0 0 10px rgba(0, 243, 255, 0.35);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; padding: 10px; overflow-x: hidden; }
        
        header { width: 100%; max-width: 420px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 0 4px; }
        h1 { font-size: 1.25rem; color: var(--neon-cyan); text-shadow: 0 0 8px rgba(0, 243, 255, 0.5); letter-spacing: 1.5px; }
        .node-tag { font-size: 0.75rem; color: #00ff66; background: rgba(0,255,102,0.12); border: 1px solid rgba(0,255,102,0.35); padding: 3px 8px; border-radius: 4px; font-weight: bold; }

        .screen { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .hidden { display: none !important; }

        .menu-panel { background-color: var(--panel-bg); border: 1px solid var(--neon-cyan); box-shadow: var(--border-glow); border-radius: 12px; padding: 20px; width: 100%; display: flex; flex-direction: column; gap: 12px; margin-top: 50px; }
        .btn-cyber { background: linear-gradient(135deg, #1f293d 0%, #111827 100%); border: 1px solid var(--neon-cyan); color: var(--neon-cyan); padding: 14px; border-radius: 8px; font-size: 0.95rem; font-weight: bold; cursor: pointer; transition: all 0.2s ease; text-align: center; text-transform: uppercase; }
        .btn-cyber:active { transform: scale(0.98); }
        .btn-secondary { border-color: var(--neon-purple); color: var(--neon-purple); }

        .game-hud { width: 100%; display: flex; justify-content: space-between; align-items: center; background: var(--panel-bg); border: 1px solid var(--neon-cyan); padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; }
        
        /* Grid perfeitamente esquadrinhado 1:1 com células simétricas */
        .board-wrapper { width: min(94vw, 400px); aspect-ratio: 1 / 1; border: 2px solid var(--neon-purple); box-shadow: 0 0 15px rgba(176, 0, 255, 0.4); border-radius: 8px; overflow: hidden; background: var(--panel-bg); margin: 6px auto; }
        #board-container { width: 100%; height: 100%; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); }
        
        .square { display: flex; align-items: center; justify-content: center; font-size: clamp(1.5rem, 5.8vw, 2.2rem); cursor: pointer; user-select: none; width: 100%; height: 100%; }
        .square.light { background-color: #24344d; }
        .square.dark { background-color: #111827; }
        .square.selected { background-color: rgba(0, 243, 255, 0.5) !important; box-shadow: inset 0 0 12px var(--neon-cyan); }

        #match-status { font-size: 0.8rem; color: var(--neon-cyan); text-align: center; min-height: 18px; }
        footer { margin-top: 10px; font-size: 0.75rem; color: #64748b; text-align: center; }
    </style>
</head>
<body>

    <header>
        <h1>CHESS 5C ARENA</h1>
        <span class="node-tag">ONLINE</span>
    </header>

    <div id="screen-lobby" class="screen">
        <div class="menu-panel">
            <button class="btn-cyber" onclick="enterGame('friendly')">Modo Amistoso (Gratuito)</button>
            <button class="btn-cyber" onclick="enterGame('competitive')">Arena Competitiva (0.05 USDC)</button>
            <button class="btn-cyber btn-secondary" onclick="openSkinShop()">Loja de Skins NFT (Em Breve)</button>
        </div>
    </div>

    <div id="screen-game" class="screen hidden">
        <div class="game-hud">
            <span id="turn-indicator">Turno: Brancas</span>
            <button class="btn-cyber" style="padding: 5px 12px; font-size: 0.75rem;" onclick="returnToLobby()">Lobby</button>
        </div>
        <div class="board-wrapper">
            <div id="board-container"></div>
        </div>
        <div id="match-status">Toque em uma peça para mover</div>
    </div>

    <footer>Chess 5C Arena &bull; Cyberpunk Edition</footer>

    <script>
        let boardState = [];
        let selectedSquare = null;
        let currentTurn = 'white';

        function initBoardData() {
            boardState = [
                ["♜","♞","♝","♛","♚","♝","♞","♜"],
                ["♟","♟","♟","♟","♟","♟","♟","♟"],
                ["","","","","","","",""],
                ["","","","","","","",""],
                ["","","","","","","",""],
                ["","","","","","","",""],
                ["♙","♙","♙","♙","♙","♙","♙","♙"],
                ["♖","♘","♗","♕","♔","♗","♘","♖"]
            ];
        }

        function enterGame(mode) {
            if(mode === 'competitive') alert('Simulando aprovação de smart contract: 0.05 USDC escrow locked.');
            document.getElementById('screen-lobby').classList.add('hidden');
            document.getElementById('screen-game').classList.remove('hidden');
            initBoardData();
            renderBoard();
        }

        function returnToLobby() {
            document.getElementById('screen-game').classList.add('hidden');
            document.getElementById('screen-lobby').classList.remove('hidden');
        }

        function renderBoard() {
            const boardEl = document.getElementById('board-container');
            boardEl.innerHTML = '';
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const sq = document.createElement('div');
                    sq.className = 'square ' + ((r + c) % 2 === 0 ? 'light' : 'dark');
                    const piece = boardState[r][c];
                    if (piece) {
                        sq.textContent = piece;
                        const isWhite = "♙♖♘♗♕♔".includes(piece);
                        sq.style.color = isWhite ? '#e0e6ed' : '#00f3ff';
                        sq.style.textShadow = isWhite ? '0 0 6px rgba(224,230,237,0.7)' : '0 0 9px rgba(0,243,255,0.85)';
                    }
                    if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) sq.classList.add('selected');
                    sq.onclick = () => handleSquareClick(r, c);
                    boardEl.appendChild(sq);
                }
            }
            document.getElementById('turn-indicator').textContent = 'Turno: ' + (currentTurn === 'white' ? 'Brancas' : 'Pretas');
        }

        function handleSquareClick(r, c) {
            const p = boardState[r][c];
            const isWhitePiece = (piece) => "♙♖♘♗♕♔".includes(piece);
            if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) { selectedSquare = null; renderBoard(); return; }
            if (selectedSquare) {
                const selPiece = boardState[selectedSquare.r][selectedSquare.c];
                if (p && (isWhitePiece(p) === isWhitePiece(selPiece))) {
                    selectedSquare = {r, c}; renderBoard(); return;
                }
                boardState[r][c] = selPiece;
                boardState[selectedSquare.r][selectedSquare.c] = "";
                selectedSquare = null;
                currentTurn = currentTurn === 'white' ? 'black' : 'white';
                document.getElementById('match-status').textContent = 'Movimento realizado';
                renderBoard();
                return;
            }
            if (p) { 
                selectedSquare = {r, c}; 
                document.getElementById('match-status').textContent = `Selecionado [${r+1},${c+1}]`;
                renderBoard(); 
            }
        }

        function openSkinShop() { alert('Loja de Skins NFT em breve!'); }
    </script>
</body>
</html>
