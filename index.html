<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chess 5C - Arena Web3 & NFTs</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
body {
  background-color: #12161c;
  color: #c9d1d9;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  min-height: 100vh;
  margin: 0;
  padding: 8px;
}
.arena-container {
  background: linear-gradient(135deg, #1e242d 0%, #12161c 100%);
  border: 2px solid #30363d;
  border-radius: 14px;
  padding: 10px;
  text-align: center;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
  width: 100%;
  max-width: 400px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
h2 {
  color: #58a6ff;
  margin: 2px 0 8px 0;
  letter-spacing: 1px;
  text-transform: uppercase;
  font-size: 15px;
}
button {
  background: linear-gradient(135deg, #238636 0%, #2ea043 100%);
  color: white;
  border: none;
  border-radius: 8px;
  padding: 10px 16px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  width: 100%;
  margin-top: 6px;
  box-shadow: 0 4px 12px rgba(35, 134, 54, 0.4);
}
.btn-secondary {
  background: linear-gradient(135deg, #1f6feb 0%, #388bfd 100%);
  box-shadow: 0 4px 12px rgba(31, 111, 235, 0.4);
}
.btn-nft {
  background: linear-gradient(135deg, #8957e5 0%, #a371f7 100%);
  box-shadow: 0 4px 12px rgba(137, 87, 229, 0.4);
}
button:active {
  transform: scale(0.97);
}
#status {
  margin: 6px 0;
  font-size: 11px;
  color: #8b949e;
  background: #161b22;
  padding: 6px;
  border-radius: 6px;
  border: 1px solid #30363d;
  word-break: break-all;
  width: 100%;
}

.player-panel {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  background: #161b22;
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid #30363d;
  margin: 4px 0;
  font-size: 13px;
}
.player-info {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: bold;
  color: #c9d1d9;
}
.timer {
  background: #21262d;
  padding: 4px 8px;
  border-radius: 6px;
  font-family: monospace;
  font-size: 13px;
  color: #58a6ff;
  border: 1px solid #30363d;
}

#boardContainer {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Tabuleiro Perfeito com Proporção 1:1 e Borda Clássica */
#board {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  grid-template-rows: repeat(8, 1fr);
  width: 90vw;
  max-width: 360px;
  aspect-ratio: 1 / 1;
  margin: 8px auto;
  border: 5px solid #5c3a21;
  border-radius: 4px;
  overflow: hidden;
  box-shadow: 0 6px 16px rgba(0,0,0,0.8);
  background-color: #5c3a21;
}

.square {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  cursor: pointer;
  user-select: none;
  position: relative;
  width: 100%;
  height: 100%;
}
.square.light {
  background-color: #f0d9b5;
}
.square.dark {
  background-color: #b58863;
}
.square.selected {
  background-color: #7b9c37 !important;
  box-shadow: inset 0 0 0 3px #41591f;
}
.square.highlight::after {
  content: '';
  position: absolute;
  width: 12px;
  height: 12px;
  background-color: rgba(0, 0, 0, 0.35);
  border-radius: 50%;
}

.coord-file {
  position: absolute;
  bottom: 1px;
  right: 3px;
  font-size: 9px;
  font-weight: bold;
  pointer-events: none;
  opacity: 0.7;
}
.coord-rank {
  position: absolute;
  top: 1px;
  left: 3px;
  font-size: 9px;
  font-weight: bold;
  pointer-events: none;
  opacity: 0.7;
}
.square.light .coord-file, .square.light .coord-rank { color: #b58863; }
.square.dark .coord-file, .square.dark .coord-rank { color: #f0d9b5; }

/* Estilo das Peças (Suporta Texto ou Tags de Imagem para as Skins NFT) */
.piece {
  width: 85%;
  height: 85%;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
}
.piece-w {
  color: #ffffff;
  text-shadow: 0 2px 3px rgba(0, 0, 0, 0.95);
  font-weight: bold;
}
.piece-b {
  color: #1a1a1a;
  text-shadow: 0 1px 2px rgba(255, 255, 255, 0.6);
}
</style>
</head>
<body>

<div class="arena-container">
<h2>Chess 5C Arena</h2>
<button id="connectBtn">Conectar Carteira</button>

<div id="gameModes" style="display:none; width: 100%;">
<button id="friendlyBtn" class="btn-secondary">Modo Amistoso (Gratuito)</button>
<button id="joinBtn">Arena Competitiva (0.05 USDC)</button>
<button id="nftStoreBtn" class="btn-nft">Loja de Skins NFT (Em Breve)</button>
</div>

<p id="status">Status: Aguardando conexão...</p>

<div id="boardContainer" style="display:none;">
  <div class="player-panel">
    <div class="player-info">👑 KingKong</div>
    <div class="timer" id="timerBlack">10:00</div>
  </div>

  <div id="board"></div>

  <div class="player-panel">
    <div class="player-info">🛡️ Jefferson</div>
    <div class="timer" id="timerWhite">10:00</div>
  </div>

  <button id="exitBtn" class="btn-secondary" style="margin-top: 6px; padding: 8px; font-size: 12px;">Sair / Voltar</button>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>

<script>
const USDC_ADDRESS = "0x8335200cd6164806ce600d99f850e08436282913";
const USDC_ABI = ["function transfer(address recipient, uint256 amount) returns (bool)"];

let provider, signer, userAddress;
let game = new Chess();
let selectedSquare = null;
let validMoves = [];

// Mapeamento padrão (pode ser substituído por links de imagens PNG/SVG dos seus NFTs customizados!)
const pieceSymbols = {
  p: '♟', r: '♜', n: '♞', b: '♝', q: '♛', k: '♚',
  P: '♙', R: '♖', N: '♘', B: '♗', Q: '♕', K: '♔'
};

document.getElementById('connectBtn').addEventListener('click', async () => {
  const statusEl = document.getElementById('status');
  if (typeof window.ethereum === 'undefined') {
    statusEl.innerText = "Status: Carteira não encontrada!";
    return;
  }
  try {
    statusEl.innerText = "Status: Conectando...";
    provider = new ethers.BrowserProvider(window.ethereum);
    await provider.send("eth_requestAccounts", []);
    signer = await provider.getSigner();
    userAddress = await signer.getAddress();

    statusEl.innerText = `Conectado: ${userAddress.substring(0, 6)}...${userAddress.substring(38)}`;
    document.getElementById('connectBtn').innerText = "Carteira Conectada";
    document.getElementById('connectBtn').style.background = "#21262d";
    document.getElementById('gameModes').style.display = "block";
  } catch (error) {
    statusEl.innerText = "Status: Erro na conexão.";
  }
});

document.getElementById('friendlyBtn').addEventListener('click', () => startMatch("Modo Amistoso"));
document.getElementById('nftStoreBtn').addEventListener('click', () => {
  alert("Coleção de Skins NFT em desenvolvimento! Em breve você poderá equipar suas tropas customizadas.");
});

document.getElementById('joinBtn').addEventListener('click', async () => {
  const statusEl = document.getElementById('status');
  if (!signer) return;
  try {
    statusEl.innerText = "Status: Solicitando 0.05 USDC...";
    const usdcContract = new ethers.Contract(USDC_ADDRESS, USDC_ABI, signer);
    const tx = await usdcContract.transfer(userAddress, ethers.parseUnits("0.05", 6));
    statusEl.innerText = "Status: Gravando na blockchain...";
    await tx.wait();
    startMatch("Arena Competitiva");
  } catch (error) {
    statusEl.innerText = "Status: Transação cancelada.";
  }
});

document.getElementById('exitBtn').addEventListener('click', () => {
  document.getElementById('boardContainer').style.display = "none";
  document.getElementById('gameModes').style.display = "block";
  document.getElementById('status').innerText = "Status: Conectado.";
});

function startMatch(statusMsg) {
  document.getElementById('status').innerText = `Status: ${statusMsg}`;
  document.getElementById('gameModes').style.display = "none";
  document.getElementById('boardContainer').style.display = "block";
  game.reset();
  selectedSquare = null;
  validMoves = [];
  renderBoard();
}

function renderBoard() {
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  const boardData = game.board();

  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const squareEl = document.createElement('div');
      const isDark = (r + c) % 2 === 1;
      squareEl.className = `square ${isDark ? 'dark' : 'light'}`;
      
      const file = 'abcdefgh'[c];
      const rank = '87654321'[r];
      const squareCoord = file + rank;

      if (r === 7) {
        const fileSpan = document.createElement('span');
        fileSpan.className = 'coord-file';
        fileSpan.innerText = file;
        squareEl.appendChild(fileSpan);
      }
      if (c === 0) {
        const rankSpan = document.createElement('span');
        rankSpan.className = 'coord-rank';
        rankSpan.innerText = rank;
        squareEl.appendChild(rankSpan);
      }

      if (selectedSquare === squareCoord) squareEl.classList.add('selected');
      if (validMoves.includes(squareCoord)) squareEl.classList.add('highlight');

      const piece = boardData[r][c];
      if (piece) {
        const pieceDiv = document.createElement('div');
        pieceDiv.className = `piece ${piece.color === 'w' ? 'piece-w' : 'piece-b'}`;
        
        // Aqui é onde os NFTs entram no futuro: se o usuário tiver uma skin, trocamos por uma tag <img>
        pieceDiv.innerText = pieceSymbols[piece.color === 'w' ? piece.type.toUpperCase() : piece.type.toLowerCase()];
        
        squareEl.appendChild(pieceDiv);
      }

      squareEl.addEventListener('click', () => handleSquareClick(squareCoord));
      boardEl.appendChild(squareEl);
    }
  }

  if (game.in_checkmate()) {
    document.getElementById('status').innerText = "Fim de Jogo: Xeque-Mate!";
  } else if (game.in_draw()) {
    document.getElementById('status').innerText = "Fim de Jogo: Empate!";
  }
}

function handleSquareClick(square) {
  if (!selectedSquare) {
    const piece = game.get(square);
    if (piece && piece.color === game.turn()) {
      selectedSquare = square;
      validMoves = game.moves({ square: square, verbose: true }).map(m => m.to);
      renderBoard();
    }
  } else {
    const move = game.move({ from: selectedSquare, to: square, promotion: 'q' });
    selectedSquare = null;
    validMoves = [];
    if (move) {
      renderBoard();
    } else {
      const piece = game.get(square);
      if (piece && piece.color === game.turn()) {
        selectedSquare = square;
        validMoves = game.moves({ square: square, verbose: true }).map(m => m.to);
      }
      renderBoard();
    }
  }
}
</script>
</body>
</html>
